<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모객대기 고객 관리 | 여행컨설턴트 이실장</title>
<style>
  :root{
    --navy:#1C3557;
    --navy-light:#2C4A76;
    --coral:#E8593A;
    --coral-light:#FBE9E4;
    --gold:#C8973A;
    --gold-light:#FBF3E1;
    --green:#2F8F5B;
    --green-light:#E7F5EC;
    --gray-bg:#F5F6F8;
    --gray-line:#E3E6EB;
    --gray-text:#6B7280;
    --ink:#1F2430;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--gray-bg);
    color:var(--ink);
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 0 60px;}

  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;
    padding:28px 24px 24px;
    border-radius:0 0 20px 20px;
    margin-bottom:20px;
  }
  header .brand{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
  }
  header h1{margin:0;font-size:22px;font-weight:800;}
  header p{margin:6px 0 0;font-size:13px;color:#C9D3E0;}

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:0 24px;
    margin-bottom:22px;
  }
  .stat-card{
    background:#fff;
    border:1px solid var(--gray-line);
    border-radius:14px;
    padding:14px 12px;
    text-align:center;
  }
  .stat-card .num{font-size:22px;font-weight:800;color:var(--navy);}
  .stat-card.urgent .num{color:var(--coral);}
  .stat-card .label{font-size:11px;color:var(--gray-text);margin-top:2px;}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 24px;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{
    padding:7px 13px;
    border-radius:20px;
    background:#fff;
    border:1px solid var(--gray-line);
    font-size:12.5px;
    cursor:pointer;
    color:var(--gray-text);
    font-weight:600;
    white-space:nowrap;
  }
  .tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .btn-add{
    background:var(--coral);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .btn-add:hover{opacity:.92;}

  .list{padding:0 24px;display:flex;flex-direction:column;gap:10px;}

  .card{
    background:#fff;
    border-radius:14px;
    border:1px solid var(--gray-line);
    border-left:5px solid var(--gray-line);
    padding:14px 16px;
    position:relative;
  }
  .card.overdue{border-left-color:var(--coral);background:linear-gradient(90deg,var(--coral-light) 0%, #fff 12%);}
  .card.soon{border-left-color:var(--gold);}
  .card.ok{border-left-color:var(--green);}
  .card.confirmed{border-left-color:var(--navy);opacity:.85;}
  .card.lost{border-left-color:#B0B4BC;opacity:.6;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .name{font-size:16px;font-weight:800;}
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
  }
  .badge.overdue{background:var(--coral);color:#fff;}
  .badge.soon{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold);}
  .badge.ok{background:var(--green-light);color:var(--green);}
  .badge.confirmed{background:var(--navy);color:#fff;}
  .badge.lost{background:#EDEEF1;color:#8A8F99;}

  .phone{font-size:12.5px;color:var(--gray-text);}
  .product{font-size:13.5px;margin-top:6px;font-weight:600;color:var(--navy);}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;font-size:12px;color:var(--gray-text);}
  .meta-row span b{color:var(--ink);font-weight:700;}
  .notes{font-size:12.5px;color:#7A7F8A;margin-top:8px;background:#FAFAFB;border-radius:8px;padding:8px 10px;}

  .card-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .card-actions button{
    border:none;
    border-radius:8px;
    padding:7px 11px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .act-check{background:var(--navy);color:#fff;}
  .act-confirm{background:var(--green);color:#fff;}
  .act-lost{background:#fff;color:var(--coral);border:1px solid var(--coral) !important;}
  .act-edit{background:#fff;color:var(--gray-text);border:1px solid var(--gray-line) !important;}
  .act-del{background:#fff;color:#B0B4BC;border:1px solid var(--gray-line) !important;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--gray-text);
    font-size:13.5px;
  }

  /* Modal */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(20,25,40,.45);
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;
    border-radius:16px;
    padding:22px;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h2{margin:0 0 16px;font-size:17px;color:var(--navy);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--gray-text);margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-weight:700;
    font-size:13.5px;
    border:none;
    cursor:pointer;
  }
  .btn-save{background:var(--coral);color:#fff;}
  .btn-cancel{background:#F0F1F3;color:var(--gray-text);}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">여행컨설턴트 이실장</div>
    <h1>모객대기 고객 관리</h1>
    <p>출발 미정 · 결제대기 손님을 놓치지 않도록 확인 주기를 자동으로 관리합니다</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <button class="btn-add" onclick="openModal()">+ 손님 등록</button>
  </div>

  <div class="list" id="list"></div>

  <div style="padding:20px 24px 0;">
    <div class="tab" style="display:inline-block;" onclick="toggleAdvanced()">⚙ 고급: 데이터 직접 관리</div>
    <div id="advancedPanel" style="display:none;margin-top:12px;background:#fff;border:1px solid var(--gray-line);border-radius:14px;padding:16px;">
      <p style="font-size:12.5px;color:var(--gray-text);margin:0 0 10px;">중복 등록되거나 삭제가 안 되는 항목이 있을 때, 아래 원본 데이터를 직접 고쳐서 저장할 수 있습니다. 지우고 싶은 손님의 통째 항목(중괄호 { } 부분)을 지운 뒤 '이 내용으로 저장'을 눌러주세요.</p>
      <textarea id="rawData" style="width:100%;min-height:220px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--gray-line);border-radius:8px;"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="act-check" style="flex:1;padding:9px;" onclick="loadRawIntoTextarea()">현재 데이터 불러오기</button>
        <button class="act-confirm" style="flex:1;padding:9px;" onclick="saveRawFromTextarea()">이 내용으로 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">손님 등록</h2>
    <div class="field">
      <label>고객명</label>
      <input id="f_name" type="text" placeholder="예: 김민수">
    </div>
    <div class="field-row">
      <div class="field">
        <label>연락처</label>
        <input id="f_phone" type="text" placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label>결제상태</label>
        <select id="f_payment">
          <option value="예약금 결제">예약금 결제</option>
          <option value="미결제">미결제</option>
          <option value="완납">완납</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>여행상품 / 목적지</label>
      <input id="f_product" type="text" placeholder="예: 다낭 4박6일 (진에어)">
    </div>
    <div class="field-row">
      <div class="field">
        <label>예약일</label>
        <input id="f_resDate" type="date">
      </div>
      <div class="field">
        <label>희망 출발시기</label>
        <input id="f_wantDate" type="text" placeholder="예: 9월 중">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>마지막 확인일</label>
        <input id="f_lastCheck" type="date">
      </div>
      <div class="field">
        <label>확인 주기(일)</label>
        <input id="f_interval" type="number" min="1" value="7">
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="f_notes" placeholder="예: 최소 인원 4명 필요, 2명 확보"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEntry()">저장</button>
    </div>
  </div>
</div>

<script>
let customers = [];
let editingId = null;
let currentFilter = 'active';

const STATUS_LABEL = {waiting:'대기중', confirmed:'출발확정', lost:'이탈/취소'};

function loadData(){
  try{
    const raw = localStorage.getItem('waitlist_customers');
    customers = raw ? JSON.parse(raw) : [];
  }catch(e){
    customers = [];
  }
  render();
}

function persist(){
  try{
    localStorage.setItem('waitlist_customers', JSON.stringify(customers));
  }catch(e){
    console.error('저장 실패', e);
  }
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function daysBetween(a,b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2-d1)/(1000*60*60*24));
}

function urgencyOf(c){
  if(c.status !== 'waiting') return c.status;
  const passed = daysBetween(c.lastCheck, todayStr());
  const dueIn = c.interval - passed;
  if(dueIn <= 0) return 'overdue';
  if(dueIn <= 2) return 'soon';
  return 'ok';
}

function urgencyLabel(c){
  const u = urgencyOf(c);
  if(u==='overdue'){
    const passed = daysBetween(c.lastCheck, todayStr());
    const over = passed - c.interval;
    return over > 0 ? `확인 필요 (${over}일 지남)` : '오늘 확인 필요';
  }
  if(u==='soon') return `임박 (D-${c.interval - daysBetween(c.lastCheck, todayStr())})`;
  if(u==='ok') return '정상';
  if(u==='confirmed') return '출발확정';
  if(u==='lost') return '이탈/취소';
}

function renderStats(){
  const waiting = customers.filter(c=>c.status==='waiting');
  const overdue = waiting.filter(c=>urgencyOf(c)==='overdue').length;
  const soon = waiting.filter(c=>urgencyOf(c)==='soon').length;
  const confirmed = customers.filter(c=>c.status==='confirmed').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card urgent"><div class="num">${overdue}</div><div class="label">오늘 확인 필요</div></div>
    <div class="stat-card"><div class="num">${soon}</div><div class="label">임박</div></div>
    <div class="stat-card"><div class="num">${waiting.length}</div><div class="label">전체 대기중</div></div>
    <div class="stat-card"><div class="num">${confirmed}</div><div class="label">출발확정</div></div>
  `;
}

function renderTabs(){
  const tabs = [
    {key:'active', label:'대기중'},
    {key:'overdue', label:'확인필요'},
    {key:'confirmed', label:'출발확정'},
    {key:'lost', label:'이탈/취소'},
    {key:'all', label:'전체'},
  ];
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<div class="tab ${currentFilter===t.key?'active':''}" onclick="setFilter('${t.key}')">${t.label}</div>`
  ).join('');
}

function setFilter(f){
  currentFilter = f;
  render();
}

function filteredList(){
  let arr = [...customers];
  if(currentFilter==='active') arr = arr.filter(c=>c.status==='waiting');
  else if(currentFilter==='overdue') arr = arr.filter(c=>c.status==='waiting' && urgencyOf(c)==='overdue');
  else if(currentFilter==='confirmed') arr = arr.filter(c=>c.status==='confirmed');
  else if(currentFilter==='lost') arr = arr.filter(c=>c.status==='lost');

  const rank = {overdue:0, soon:1, ok:2, confirmed:3, lost:4};
  arr.sort((a,b)=> (rank[urgencyOf(a)]??9) - (rank[urgencyOf(b)]??9));
  return arr;
}

function renderList(){
  const arr = filteredList();
  const listEl = document.getElementById('list');
  if(arr.length===0){
    listEl.innerHTML = `<div class="empty">해당하는 손님이 없습니다.<br>우측 상단 '+ 손님 등록'으로 추가해보세요.</div>`;
    return;
  }
  listEl.innerHTML = arr.map(c=>{
    const u = urgencyOf(c);
    return `
    <div class="card ${u}">
      <div class="card-top">
        <div>
          <div class="name-line">
            <span class="name">${escapeHtml(c.name)}</span>
            <span class="badge ${u}">${urgencyLabel(c)}</span>
          </div>
          <div class="phone">${escapeHtml(c.phone||'-')}</div>
        </div>
      </div>
      <div class="product">${escapeHtml(c.product||'-')}</div>
      <div class="meta-row">
        <span>결제상태: <b>${escapeHtml(c.payment||'-')}</b></span>
        <span>희망시기: <b>${escapeHtml(c.wantDate||'-')}</b></span>
        <span>예약일: <b>${escapeHtml(c.resDate||'-')}</b></span>
        <span>마지막 확인: <b>${escapeHtml(c.lastCheck||'-')}</b></span>
        <span>확인주기: <b>${c.interval}일</b></span>
      </div>
      ${c.notes ? `<div class="notes">${escapeHtml(c.notes)}</div>` : ''}
      <div class="card-actions">
        ${c.status==='waiting' ? `<button class="act-check" onclick="markChecked('${c.id}')">오늘 확인완료</button>` : ''}
        ${c.status==='waiting' ? `<button class="act-confirm" onclick="markConfirmed('${c.id}')">출발확정</button>` : ''}
        ${c.status==='waiting' ? `<button class="act-lost" onclick="markLost('${c.id}')">이탈/취소</button>` : ''}
        ${c.status!=='waiting' ? `<button class="act-check" onclick="markWaiting('${c.id}')">대기중으로 되돌리기</button>` : ''}
        <button class="act-edit" onclick="editEntry('${c.id}')">수정</button>
        <button class="act-del" onclick="deleteEntry('${c.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  renderStats();
  renderTabs();
  renderList();
}

function openModal(id){
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '손님 정보 수정' : '손님 등록';
  if(id){
    const c = customers.find(x=>x.id===id);
    document.getElementById('f_name').value = c.name||'';
    document.getElementById('f_phone').value = c.phone||'';
    document.getElementById('f_payment').value = c.payment||'예약금 결제';
    document.getElementById('f_product').value = c.product||'';
    document.getElementById('f_resDate').value = c.resDate||'';
    document.getElementById('f_wantDate').value = c.wantDate||'';
    document.getElementById('f_lastCheck').value = c.lastCheck||todayStr();
    document.getElementById('f_interval').value = c.interval||7;
    document.getElementById('f_notes').value = c.notes||'';
  }else{
    document.getElementById('f_name').value = '';
    document.getElementById('f_phone').value = '';
    document.getElementById('f_payment').value = '예약금 결제';
    document.getElementById('f_product').value = '';
    document.getElementById('f_resDate').value = todayStr();
    document.getElementById('f_wantDate').value = '';
    document.getElementById('f_lastCheck').value = todayStr();
    document.getElementById('f_interval').value = 7;
    document.getElementById('f_notes').value = '';
  }
  document.getElementById('overlay').classList.add('show');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
}

async function saveEntry(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('고객명을 입력해주세요.'); return; }
  const data = {
    name,
    phone: document.getElementById('f_phone').value.trim(),
    payment: document.getElementById('f_payment').value,
    product: document.getElementById('f_product').value.trim(),
    resDate: document.getElementById('f_resDate').value,
    wantDate: document.getElementById('f_wantDate').value.trim(),
    lastCheck: document.getElementById('f_lastCheck').value || todayStr(),
    interval: parseInt(document.getElementById('f_interval').value) || 7,
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(editingId){
    const idx = customers.findIndex(c=>c.id===editingId);
    customers[idx] = {...customers[idx], ...data};
  }else{
    customers.push({id: makeId(), status:'waiting', ...data});
  }
  await persist();
  closeModal();
  render();
}

function editEntry(id){ openModal(id); }

async function deleteEntry(id){
  if(!confirm('이 손님 정보를 삭제할까요?')) return;
  customers = customers.filter(c=>c.id!==id);
  await persist();
  render();
}

async function markChecked(id){
  const c = customers.find(x=>x.id===id);
  c.lastCheck = todayStr();
  await persist();
  render();
}

async function markConfirmed(id){
  const c = customers.find(x=>x.id===id);
  c.status = 'confirmed';
  await persist();
  render();
}

async function markLost(id){
  const c = customers.find(x=>x.id===id);
  c.status = 'lost';
  await persist();
  render();
}

async function markWaiting(id){
  const c = customers.find(x=>x.id===id);
  c.status = 'waiting';
  c.lastCheck = todayStr();
  await persist();
  render();
}

function toggleAdvanced(){
  const el = document.getElementById('advancedPanel');
  const willShow = el.style.display === 'none';
  el.style.display = willShow ? 'block' : 'none';
  if(willShow) loadRawIntoTextarea();
}

function loadRawIntoTextarea(){
  document.getElementById('rawData').value = JSON.stringify(customers, null, 2);
}

function saveRawFromTextarea(){
  const text = document.getElementById('rawData').value;
  let parsed;
  try{
    parsed = JSON.parse(text);
    if(!Array.isArray(parsed)) throw new Error('배열 형태가 아닙니다');
  }catch(e){
    alert('저장 실패: 형식이 올바르지 않습니다.\n중괄호 { }와 쉼표(,) 짝이 맞는지 확인해주세요.\n\n' + e.message);
    return;
  }
  customers = parsed;
  persist();
  render();
  alert('저장되었습니다.');
}

function makeId(){
  return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

loadData();
</script>
</body>
</html>
